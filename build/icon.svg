<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE54D"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- macOS app icon grid: 824×824 body on a 1024 canvas, ~185 corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="4"/>
  <!-- eyes -->
  <ellipse cx="392" cy="420" rx="44" ry="78" fill="#1B1B1B"/>
  <ellipse cx="632" cy="420" rx="44" ry="78" fill="#1B1B1B"/>
  <!-- smile -->
  <path d="M302 584 Q512 800 722 584" fill="none" stroke="#1B1B1B" stroke-width="42" stroke-linecap="round"/>
</svg>
